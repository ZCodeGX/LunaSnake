on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clonar y compilar Luna
        run: |
          git clone --depth 1 https://github.com/ZCodeGX/Luna.git luna-src
          cd luna-src
          ./luna.py build
      - name: Pruebas del juego
        env:
          LUNA: ${{ github.workspace }}/luna-src/build/luna
        run: ./tests/run.sh
